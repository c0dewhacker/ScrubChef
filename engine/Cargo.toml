[package]
name = "engine"
version = "0.1.0"
edition = "2024"
description = "Local-first redaction engine for ScrubChef, compiled to WebAssembly."
repository = "https://github.com/c0dewhacker/ScrubChef"
license = "MIT"
# LazyLock (std) requires 1.80; edition 2024 requires 1.85.
rust-version = "1.85"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"
getrandom = { version = "0.4", features = ["wasm_js"] }
zeroize = "1.8"

# Optimise for artifact size: the .wasm is base64-inlined into a single HTML file,
# so every byte here costs ~1.37 bytes in the distributable.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

# At opt-level "z" rustc emits bulk-memory ops (memory.copy) for struct moves. wasm-opt
# must be told to accept them, or it fails validation on older wasm-pack builds.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ['-Oz', '--enable-bulk-memory']
