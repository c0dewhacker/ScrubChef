# Nothing previously validated a pull request: lint, tests and the WASM build only ran as
# part of a release. Dependabot PRs in particular had no signal at all.
name: CI

on:
  pull_request:
  push:
    branches: [master, development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/target
          key: ${{ runner.os }}-cargo-ci-${{ hashFiles('engine/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-ci-

      - name: Check formatting
        run: cargo fmt --check
        working-directory: engine

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: engine

      - name: Unit tests
        run: cargo test
        working-directory: engine

      # The engine's whole purpose is to run in the browser, so a native build passing is
      # not enough — the wasm32 target has its own constraints (see getrandom's backend cfg).
      # Installed directly rather than through jetli/wasm-pack-action. That action is
      # unmaintained (latest release 2022), still targets Node 20, and resolved its
      # `version: latest` at run time — silently installing a 2020-era wasm-pack whose
      # wasm-opt could not validate the features current rustc emits, which is how the same
      # commit passed on a pull request and failed on master hours later. A pinned download
      # with a verified checksum has none of those properties, and the toolchain that builds
      # a redaction engine is worth verifying.
      - name: Install wasm-pack
        env:
          WASM_PACK_VERSION: v0.15.0
          WASM_PACK_SHA256: c09f971ecaed9a2efc80fdcea7a00ef6b53c7fadc8c57d1f61b53a6aa66b668a
        run: |
          set -euo pipefail
          tarball="wasm-pack-${WASM_PACK_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL --retry 3 \
            "https://github.com/rustwasm/wasm-pack/releases/download/${WASM_PACK_VERSION}/${tarball}" \
            -o "$tarball"
          echo "${WASM_PACK_SHA256}  ${tarball}" | sha256sum --check --strict
          tar -xzf "$tarball" --strip-components=1 \
            "wasm-pack-${WASM_PACK_VERSION}-x86_64-unknown-linux-musl/wasm-pack"
          install -m 0755 wasm-pack /usr/local/bin/wasm-pack
          rm -f "$tarball" wasm-pack
          wasm-pack --version

      - name: Build for wasm32
        run: wasm-pack build --target web
        working-directory: engine

      - name: Upload engine artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wasm-engine
          path: |
            engine/pkg/engine.js
            engine/pkg/engine_bg.wasm
            engine/pkg/engine.d.ts
            engine/pkg/engine_bg.wasm.d.ts
          if-no-files-found: error

  ui:
    name: UI (TypeScript)
    runs-on: ubuntu-latest
    needs: engine
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # src/engine is gitignored build output, and `tsc -b` needs it to typecheck the worker.
      - name: Fetch engine artifacts
        uses: actions/download-artifact@v7
        with:
          name: wasm-engine
          path: ui/src/engine

      - name: Install dependencies
        run: npm ci
        working-directory: ui

      - name: Lint
        run: npm run lint
        working-directory: ui

      - name: Typecheck and build
        run: npm run build
        working-directory: ui

      - name: Check the distributable is self-contained
        working-directory: ui
        run: |
          test -f dist/index.html || { echo "dist/index.html missing"; exit 1; }
          # The artifact is meant to work offline from file://. Any external script/style
          # reference or network fetch would break that guarantee.
          if grep -qE '<(script|link)[^>]+(src|href)="(https?:)?//' dist/index.html; then
            echo "::error::dist/index.html references an external script or stylesheet"
            exit 1
          fi
          echo "Artifact size: $(du -h dist/index.html | cut -f1)"

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
        working-directory: ui

      # Advisory only: dev-tooling CVEs do not reach the shipped artifact, and failing the
      # build on them would block unrelated work.
      - name: npm audit (full, advisory)
        run: npm audit || true
        working-directory: ui

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: cargo audit
        run: cargo audit
        working-directory: engine
