# Nothing previously validated a pull request: lint, tests and the WASM build only ran as
# part of a release. Dependabot PRs in particular had no signal at all.
name: CI

on:
  pull_request:
  push:
    branches: [master, development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/target
          key: ${{ runner.os }}-cargo-ci-${{ hashFiles('engine/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-ci-

      - name: Check formatting
        run: cargo fmt --check
        working-directory: engine

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: engine

      - name: Unit tests
        run: cargo test
        working-directory: engine

      # The engine's whole purpose is to run in the browser, so a native build passing is
      # not enough — the wasm32 target has its own constraints (see getrandom's backend cfg).
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          # Pinned, not `latest`: the action resolves "latest" at run time and silently falls
          # back to its own 2020-era default (v0.9.1) when that lookup fails. That shipped a
          # wasm-opt too old to validate the features current rustc emits, so the same commit
          # passed on a pull request and failed on master hours later.
          version: v0.15.0

      - name: Build for wasm32
        run: wasm-pack build --target web
        working-directory: engine

      - name: Upload engine artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-engine
          path: |
            engine/pkg/engine.js
            engine/pkg/engine_bg.wasm
            engine/pkg/engine.d.ts
            engine/pkg/engine_bg.wasm.d.ts
          if-no-files-found: error

  ui:
    name: UI (TypeScript)
    runs-on: ubuntu-latest
    needs: engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # src/engine is gitignored build output, and `tsc -b` needs it to typecheck the worker.
      - name: Fetch engine artifacts
        uses: actions/download-artifact@v4
        with:
          name: wasm-engine
          path: ui/src/engine

      - name: Install dependencies
        run: npm ci
        working-directory: ui

      - name: Lint
        run: npm run lint
        working-directory: ui

      - name: Typecheck and build
        run: npm run build
        working-directory: ui

      - name: Check the distributable is self-contained
        working-directory: ui
        run: |
          test -f dist/index.html || { echo "dist/index.html missing"; exit 1; }
          # The artifact is meant to work offline from file://. Any external script/style
          # reference or network fetch would break that guarantee.
          if grep -qE '<(script|link)[^>]+(src|href)="(https?:)?//' dist/index.html; then
            echo "::error::dist/index.html references an external script or stylesheet"
            exit 1
          fi
          echo "Artifact size: $(du -h dist/index.html | cut -f1)"

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
        working-directory: ui

      # Advisory only: dev-tooling CVEs do not reach the shipped artifact, and failing the
      # build on them would block unrelated work.
      - name: npm audit (full, advisory)
        run: npm audit || true
        working-directory: ui

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: cargo audit
        run: cargo audit
        working-directory: engine
