# Reusable build for the single-file distributable.
#
# Both deploy.yml and release-please.yml used to carry their own verbatim copy of these
# steps. Keeping one definition means the released artifact cannot drift between the two
# paths that produce it.
name: Build Artifact

on:
  workflow_call:
    outputs:
      version:
        description: Version read from ui/package.json
        value: ${{ jobs.build.outputs.version }}
      artifact-name:
        description: File name of the built single-page app
        value: ${{ jobs.build.outputs.artifact-name }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.vars.outputs.version }}
      artifact-name: ${{ steps.vars.outputs.artifact-name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('engine/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-wasm-

      # Installed directly rather than through jetli/wasm-pack-action. That action is
      # unmaintained (latest release 2022), still targets Node 20, and resolved its
      # `version: latest` at run time — silently installing a 2020-era wasm-pack whose
      # wasm-opt could not validate the features current rustc emits, which is how the same
      # commit passed on a pull request and failed on master hours later. A pinned download
      # with a verified checksum has none of those properties, and the toolchain that builds
      # a redaction engine is worth verifying.
      - name: Install wasm-pack
        env:
          WASM_PACK_VERSION: v0.15.0
          WASM_PACK_SHA256: c09f971ecaed9a2efc80fdcea7a00ef6b53c7fadc8c57d1f61b53a6aa66b668a
        run: |
          set -euo pipefail
          tarball="wasm-pack-${WASM_PACK_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL --retry 3 \
            "https://github.com/rustwasm/wasm-pack/releases/download/${WASM_PACK_VERSION}/${tarball}" \
            -o "$tarball"
          echo "${WASM_PACK_SHA256}  ${tarball}" | sha256sum --check --strict
          tar -xzf "$tarball" --strip-components=1 \
            "wasm-pack-${WASM_PACK_VERSION}-x86_64-unknown-linux-musl/wasm-pack"
          install -m 0755 wasm-pack /usr/local/bin/wasm-pack
          rm -f "$tarball" wasm-pack
          wasm-pack --version

      - name: Build WASM engine
        run: wasm-pack build --target web
        working-directory: engine

      - name: Copy WASM artifacts to UI
        run: |
          mkdir -p ui/src/engine
          cp engine/pkg/engine.js \
             engine/pkg/engine_bg.wasm \
             engine/pkg/engine.d.ts \
             engine/pkg/engine_bg.wasm.d.ts \
             ui/src/engine/

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: npm ci
        working-directory: ui

      - name: Build UI (single file)
        run: npm run build
        working-directory: ui

      - name: Resolve version and artifact name
        id: vars
        run: |
          VERSION=$(node -p "require('./ui/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "artifact-name=ScrubChef-$VERSION.html" >> "$GITHUB_OUTPUT"

      - name: Name the release artifact
        run: cp ui/dist/index.html "ui/dist/${{ steps.vars.outputs.artifact-name }}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./ui/dist

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: scrubchef-html
          path: ui/dist/${{ steps.vars.outputs.artifact-name }}
          if-no-files-found: error
