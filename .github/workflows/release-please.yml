name: Release Please

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.ui--release_created }}
      tag_name: ${{ steps.release.outputs.ui--tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM Engine
        run: cd engine && wasm-pack build --target web

      - name: Copy WASM artifacts to UI
        run: |
          mkdir -p ui/src/engine
          cp engine/pkg/engine.js ui/src/engine/
          cp engine/pkg/engine_bg.wasm ui/src/engine/
          cp engine/pkg/engine.d.ts ui/src/engine/
          cp engine/pkg/engine_bg.wasm.d.ts ui/src/engine/

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install UI Dependencies
        run: cd ui && npm ci

      - name: Build UI (Single File)
        run: cd ui && npm run build

      - name: Extract version
        id: vars
        run: |
          VERSION=$(node -p "require('./ui/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Rename release artifact
        run: cp ui/dist/index.html "ui/dist/ScrubChef-${{ steps.vars.outputs.version }}.html"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './ui/dist'

      - name: Attach artifact to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: "ui/dist/ScrubChef-${{ steps.vars.outputs.version }}.html"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
