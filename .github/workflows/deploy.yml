# Manual / tag-driven republish of an already-released version.
#
# The normal path is release-please.yml. This exists for re-running a deploy without cutting
# a new release, and for tags pushed by hand.
name: Build and Deploy

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

# Shares the `pages` group with release-please so two deploys cannot interleave, but never
# cancels: these jobs publish artifacts, and killing one midway left Pages inconsistent.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
